<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Rede Conviva</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/marketing/portal-marketing.css">
    <link rel="icon" type="image/png" href="imagens/LOGO_-_Conviva_+Princing38252050767201495.png">
    
    <style>
        .admin-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            color: #0f172a;
            max-width: 900px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-control:focus {
            border-color: #0055a5;
        }
        
        /* Estilos dos inputs dinâmicos em linha */
        .link-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 15px;
        }
        .row-desc {
            flex: 1; /* Campo de descrição menor */
        }
        .row-url {
            flex: 2; /* Campo de URL maior */
        }
        .btn-remover-linha {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-remover-linha:hover {
            background: #b91c1c;
        }

        .btn-salvar {
            width: 100%;
            background: #0055a5;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-salvar:hover {
            background: #003a75;
        }
        .btn-salvar:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .alert-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .section-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <nav class="hub-navbar">
        <div class="nav-container">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="imagens/Logo Conviva branco-02.png" alt="Rede Conviva" class="nav-logo">
                <button class="btn-voltar" id="btn-voltar-modulo">← Voltar ao Menu</button>
            </div>
            <span class="nav-title">Painel Administrativo</span>
            <div style="width: 120px;"></div> <!-- Espaçador para manter o título centralizado -->
        </div>
    </nav>

    <main class="marketing-main-container">
        <div class="admin-card">
            <h2 class="section-header">Gerenciador de Links de Marketing</h2>
            
            <div id="alert-success" class="alert-box alert-success">Links salvos com sucesso! Redirecionando...</div>
            <div id="alert-error" class="alert-box alert-error">Erro ao salvar as informações.</div>

            <!-- Seleção do Material -->
            <div class="form-group" style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <label for="select-material" style="margin-bottom: 4px;">Selecione o Material para Editar</label>
                    <p style="font-size: 0.8rem; color: #64748b; margin: 0;">Ao alterar o tipo de material, as chaves e links existentes serão carregados.</p>
                </div>
                <select id="select-material" class="form-control" style="max-width: 320px;">
                    <option value="horario-de-funcionamento">Horário de Funcionamento</option>
                    <option value="arte-padrao-do-aplicativo">Arte do Aplicativo</option>
                    <option value="arte-padrao-para-aniversario">Arte de Aniversário</option>
                    <option value="encartes-mensais">Encartes Mensais</option>
                    <option value="arte-padrao-para-delivery">Arte para Delivery</option>
                    <option value="arte-padrao-para-convenio">Arte para Convênio</option>
                    <option value="cafe-com-marketing">Café com Marketing</option>
                    <option value="acao-saude">Ação Saúde</option>
                </select>
            </div>

            <form id="form-admin-marketing" onsubmit="return false;">
                <div class="form-group" style="text-align: left;">
                    <label style="margin-bottom: 12px;">Lista de Links de Referência</label>
                    
                    <div id="links-dinamicos-container">
                        <!-- As linhas de input serão adicionadas dinamicamente via JS -->
                    </div>
                    
                    <button type="button" id="btn-adicionar-linha" class="btn-salvar" style="background-color: #16a34a; margin-top: 10px; margin-bottom: 25px;">
                        + Adicionar Novo Link
                    </button>
                </div>

                <button type="submit" id="btn-salvar" class="btn-salvar">Salvar Links do Material</button>
            </form>
        </div>
    </main>

    <script type="module" src="javascript/admin.js"></script>
</body>
</html>
