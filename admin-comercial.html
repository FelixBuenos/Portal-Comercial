<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin Comercial - Rede Conviva</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/marketing/portal-marketing.css">
    <link rel="icon" type="image/png" href="imagens/LOGO_-_Conviva_+Princing38252050767201495.png">

    <style>
        .admin-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            color: #0f172a;
            max-width: 900px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: #0055a5;
        }

        .upload-row {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .upload-row-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #0f172a;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .file-input-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 12px;
        }

        .file-input-wrapper input[type="file"] {
            flex: 1;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-none {
            background: #f1f5f9;
            color: #475569;
        }

        .status-uploaded {
            background: #dcfce7;
            color: #15803d;
        }

        .btn-salvar {
            width: 100%;
            background: #0055a5;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-salvar:hover {
            background: #003a75;
        }

        .btn-salvar:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .alert-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .section-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
        }
    </style>
</head>

<body>

    <nav class="hub-navbar">
        <div class="nav-container">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="imagens/Logo Conviva branco-02.png" alt="Rede Conviva" class="nav-logo">
                <button class="btn-voltar" id="btn-voltar-hub">← Voltar ao Menu</button>
            </div>
            <span class="nav-title">Painel Admin Comercial</span>
            <div style="width: 120px;"></div> <!-- Espaçador para manter o título centralizado -->
        </div>
    </nav>

    <main class="marketing-main-container">
        <div class="admin-card">
            <h2 class="section-header">Gerenciador do Portal Comercial</h2>

            <div id="alert-success" class="alert-box alert-success">Links e arquivos salvos com sucesso!
                Redirecionando...</div>
            <div id="alert-error" class="alert-box alert-error">Erro ao salvar as informações. Verifique os campos e
                tente novamente.</div>

            <!-- Seleção do Mês da Campanha -->
            <div class="form-group"
                style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
                <label for="input-mes">Mês da Campanha (Filtro Principal)</label>
                <input type="month" id="input-mes" class="form-control" style="max-width: 250px;">
                <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">Ao alterar o mês, os dados já cadastrados
                    para Encartes, Ofertas e Integrações serão carregados automaticamente.</p>
            </div>

            <form id="form-admin-comercial" onsubmit="return false;">

                <!-- Encartes Mensais -->
                <div class="form-group">
                    <label for="input-encarte">Link da Planilha de Encartes</label>
                    <input type="url" id="input-encarte" class="form-control"
                        placeholder="https://docs.google.com/spreadsheets/d/.../preview">
                </div>

                <!-- Ofertas Semanais -->
                <div class="form-group">
                    <label for="input-ofertas">Link da Planilha de Ofertas</label>
                    <input type="url" id="input-ofertas" class="form-control"
                        placeholder="https://docs.google.com/spreadsheets/d/.../preview">
                </div>

                <!-- Arquivos de Integração TXT -->
                <div class="form-group" style="margin-top: 35px; text-align: left;">
                    <label
                        style="font-size: 1.1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 20px;">
                        Arquivos de Integração TXT
                    </label>

                    <div id="txt-dinamicos-container">
                        <!-- Linhas de arquivo dinâmicas adicionadas por JS -->
                    </div>

                    <button type="button" id="btn-adicionar-txt" class="btn-salvar"
                        style="background-color: #16a34a; margin-top: 10px; margin-bottom: 25px;">
                        + Adicionar Novo Arquivo TXT
                    </button>
                </div>

                <button type="submit" id="btn-salvar" class="btn-salvar">Salvar Dados Comerciais</button>
            </form>
        </div>
    </main>

    <script type="module" src="javascript/admin-comercial.js"></script>
</body>

</html>
