<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Portal Gerencial</title>
    <link rel="icon" type="image/png" href="imagens/LOGO_-_Conviva_+Princing38252050767201495.png">
    <link rel="stylesheet" href="css/style.css"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript/nova-senha.js" defer></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f1f5f9; font-family: 'Sora', sans-serif; margin: 0;">

    <div style="background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;">
        <img src="imagens/LOGO_-_Conviva_+Princing38252050767201495.png" alt="Logo" style="max-height: 60px; margin-bottom: 20px;">
        <h2 style="color: #0f172a; margin-bottom: 10px;">Criar Nova Senha</h2>
        <p style="color: #475569; font-size: 0.9rem; margin-bottom: 25px;">Digite sua nova senha de acesso abaixo.</p>

        <div style="text-align: left; margin-bottom: 15px;">
            <label for="input-nova-senha" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a;">Nova Senha</label>
            <input type="password" id="input-nova-senha" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;" placeholder="Mínimo de 6 caracteres">
        </div>

        <div style="text-align: left; margin-bottom: 25px;">
            <label for="input-confirmar-senha" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a;">Confirmar Senha</label>
            <input type="password" id="input-confirmar-senha" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;" placeholder="Repita a senha">
        </div>

        <button id="btn-salvar-senha" style="width: 100%; background-color: #0055a5; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer;">
            Salvar e Entrar
        </button>
    </div>

</body>
</html>
