<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiais de Apoio - Portal Comercial</title>
    
    <link rel="stylesheet" href="css/hub.css">
    
    <style>
        .manual-container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--hub-radius);
            padding: 50px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-top: 5px solid #f59e0b; /* Accent cor laranja/amarela */
        }
        .manual-title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .manual-desc {
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .manual-filter-group {
            text-align: left;
            margin-bottom: 30px;
        }
        .manual-label {
            display: block;
            font-size: 0.95rem;
            color: #e2e8f0;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .manual-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: var(--hub-font);
            font-size: 1rem;
            color: #ffffff;
            background: rgba(255,255,255,0.1);
            outline: none;
            transition: all 0.2s;
        }
        .manual-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        .manual-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }
        .btn-download-manual {
            display: inline-flex;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-family: var(--hub-font);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            align-items: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }
        .btn-download-manual:hover {
            background: #f59e0b;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <main class="hub-main-container" style="margin-top: 50px;">
        <div class="manual-container">
            <h1 class="manual-title">Materiais de Apoio</h1>
            <p class="manual-desc">Selecione o mês e o ano para acessar os conteúdos de apoio correspondentes.</p>
            
            <div class="manual-filter-group">
                <label for="filtro-mes" class="manual-label">Mês de Referência</label>
                <input type="month" id="filtro-mes" class="manual-input">
            </div>

            <a id="link-download" href="#" target="_blank" class="btn-download-manual" style="display: none;">
                Acessar Materiais de Apoio <span>→</span>
            </a>
        </div>
    </main>

    <script type="module" src="javascript/materiais-apoio.js?v=1"></script>
</body>
</html>
