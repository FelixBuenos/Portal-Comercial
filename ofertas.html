<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas Comerciais - Portal Gerencial</title>
    
    <link rel="stylesheet" href="css/encartes.css">

    <script type="module" src="javascript/ofertas.js?v=1"></script>
    <link rel="icon" type="image/png" href="imagens/LOGO_-_Conviva_+Princing38252050767201495.png">
</head>
<body>

    <header class="encartes-header">
        <div class="header-esquedo">
            <h1 class="titulo-pagina">Ofertas Comerciais</h1>
        </div>

        <div class="header-direito">
            <div class="filtro-grupo">
                <label for="select-mes">Selecione a Oferta:</label>
                <select id="select-mes" disabled>
                    <option>Carregando ofertas...</option>
                </select>
                
                <button id="btn-exportar" class="btn-visualizar" style="background-color: #107c41;" disabled>Exportar Excel</button>
            </div>
        </div>
    </header>

    <main class="area-iframe" style="position: relative;">
        <!-- Loader da Planilha -->
        <div id="loader-planilha" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #f1f5f9; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; transition: opacity 0.3s ease;">
            <style>
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
            </style>
            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid rgba(0, 85, 165, 0.15); border-top-color: #0055a5; border-radius: 50%; animation: spin 1s infinite linear;"></div>
            <p style="margin-top: 15px; font-family: 'Sora', sans-serif; font-size: 0.95rem; color: #64748b; font-weight: 500;">Carregando planilha...</p>
        </div>
        <iframe id="iframe-planilha" src="" title="Visualizador de Ofertas"></iframe>
    </main>

</body>
</html>
