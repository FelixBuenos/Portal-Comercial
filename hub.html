<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Comercial - Dashboard</title>
    <!-- ANTI-INCEPTION: Impede que o hub.html abra dentro de si mesmo -->
    <script>
        if (window.self !== window.top) {
            window.top.location.href = window.location.href;
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #001229;
            --bg-light: #003a7a;
            --sidebar-width: 280px;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #0055a5;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(0, 18, 41, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 10;
        }

        .sidebar-logo {
            width: 100%;
            max-height: 45px;
            object-fit: contain;
            margin-bottom: 40px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 15px;
            padding-left: 10px;
            font-weight: 700;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 14px 16px;
            border-radius: 12px;
            font-family: 'Sora', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: left;
            width: 100%;
        }

        .nav-item:hover {
            background: var(--glass-bg);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            border-color: rgba(255,255,255,0.2);
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .nav-item .icon {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 20px;
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        .nav-item.danger {
            color: #ef4444;
        }
        .nav-item.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        /* --- Main Content --- */
        .main-content {
            flex-grow: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: transparent;
        }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* Loading Overlay for iframe */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <aside class="sidebar">
        <img src="imagens/Logo Conviva branco-02.png" alt="Rede Conviva" class="sidebar-logo">
        
        <div class="sidebar-title">Menu Comercial</div>
        
        <nav class="nav-menu" id="sidebar-nav">
            <button class="nav-item" data-target="hub-welcome.html">
                <span class="icon"></span> Início
            </button>
            <button class="nav-item" data-target="encartes.html">
                <span class="icon">🛒</span> Visualizar Encartes
            </button>
            <button class="nav-item" data-target="ofertas.html">
                <span class="icon">🏷️</span> Visualizar Ofertas
            </button>
            <button class="nav-item" data-target="integracao.html">
                <span class="icon">💻</span> Arquivos TXT
            </button>
            <button class="nav-item" data-target="manual.html">
                <span class="icon">📖</span> Manual de Ações
            </button>
            <button class="nav-item" data-target="materiais-apoio.html">
                <span class="icon">📂</span> Materiais de Apoio
            </button>
        </nav>

        <div class="sidebar-footer">
            <button id="btn-admin" class="nav-item" style="display: none;">
                <span class="icon">⚙️</span> Painel Admin
            </button>
            <a href="selecao-modulo.html" class="nav-item">
                <span class="icon">⬅️</span> Voltar Módulos
            </a>
            <button id="btn-sair" class="nav-item danger">
                <span class="icon">🚪</span> Sair
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
        </div>
        <iframe id="content-frame" class="content-frame" src="hub-welcome.html" onload="const l=document.getElementById('loading');if(l){l.style.opacity='0';setTimeout(()=>{if(l.style.opacity==='0')l.style.display='none';},400);}"></iframe>
    </main>

    <script type="module" src="javascript/servicos/auth.js"></script>
    <script type="module">
        import { Auth } from './javascript/servicos/auth.js';

        const iframe = document.getElementById('content-frame');
        const loading = document.getElementById('loading');

        function hideLoading() {
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(() => {
                    if (loading.style.opacity === '0') {
                        loading.style.display = 'none';
                    }
                }, 400);
            }
        }

        function showLoading() {
            if (loading) {
                loading.style.display = 'flex';
                loading.offsetHeight;
                loading.style.opacity = '1';
            }
        }

        // Listener imediato no iframe para não perder eventos disparados antes de awaits assíncronos
        if (iframe) {
            iframe.addEventListener('load', hideLoading);
            try {
                if (iframe.contentDocument && (iframe.contentDocument.readyState === 'complete' || iframe.contentDocument.readyState === 'interactive')) {
                    hideLoading();
                }
            } catch (e) {}
        }

        // Proteção para restauração via cache de navegação (bfcache)
        window.addEventListener('pageshow', () => {
            hideLoading();
        });

        // Failsafe máximo de segurança: oculta o loading se demorar mais que 2.5s
        setTimeout(hideLoading, 2500);

        document.addEventListener('DOMContentLoaded', async () => {
            const funcao = await Auth.verificarPermissao(['mestre', 'mestre_comercial', 'comercial', 'user', 'visualizador'], 'index.html');
            if (funcao === 'mestre' || funcao === 'mestre_comercial') {
                const btnAdmin = document.getElementById('btn-admin');
                if (btnAdmin) {
                    btnAdmin.style.display = 'flex';
                    btnAdmin.addEventListener('click', () => {
                        showLoading();
                        iframe.src = 'admin-comercial.html?t=' + new Date().getTime();
                        updateActiveBtn(btnAdmin);
                    });
                }
            }

            const btnSair = document.getElementById('btn-sair');
            if (btnSair) {
                btnSair.addEventListener('click', () => {
                    Auth.logout();
                });
            }

            const navItems = document.querySelectorAll('#sidebar-nav .nav-item');

            function updateActiveBtn(targetBtn) {
                navItems.forEach(btn => btn.classList.remove('active'));
                const btnAdmin = document.getElementById('btn-admin');
                if (btnAdmin) btnAdmin.classList.remove('active');
                if (targetBtn) targetBtn.classList.add('active');
            }

            // Define o primeiro botão ativo
            updateActiveBtn(navItems[0]);

            navItems.forEach(btn => {
                btn.addEventListener('click', () => {
                    const target = btn.getAttribute('data-target');
                    if (target) {
                        showLoading();
                        iframe.src = target.includes('?') ? target : target + '?t=' + new Date().getTime();
                        updateActiveBtn(btn);
                    }
                });
            });
        });
    </script>
</body>
</html>
